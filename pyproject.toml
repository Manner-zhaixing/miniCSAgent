[project]
name = "mini-cs-agent"
version = "0.1.0"
description = "A minimal LangGraph + FastAPI agent demo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "exa_py>=2.0",
    "fastapi>=0.139.2",
    "langchain>=0.3",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.4",
    "python-dotenv>=1.2.2",
    "sse-starlette>=2.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_cs_agent"]
