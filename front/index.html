<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini CS Agent</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5; color: #333; height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    background: #1a1a2e; color: #fff; padding: 12px 20px; font-size: 16px;
    font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg { display: flex; gap: 8px; max-width: 85%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .msg.user .avatar { background: #3b82f6; color: #fff; }
  .msg.agent .avatar { background: #1a1a2e; color: #fff; }
  .bubble {
    background: #fff; border-radius: 12px; padding: 10px 14px; line-height: 1.6;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); word-break: break-word;
  }
  .msg.user .bubble { background: #3b82f6; color: #fff; }
  .thinking {
    margin-bottom: 8px; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;
  }
  .thinking summary {
    padding: 6px 10px; cursor: pointer; font-size: 12px; color: #6b7280;
    background: #f9fafb; user-select: none;
  }
  .thinking .body {
    padding: 8px 10px; font-size: 13px; color: #6b7280; max-height: 200px; overflow-y: auto;
    white-space: pre-wrap; line-height: 1.5; border-top: 1px solid #e5e7eb;
  }
  .tool-block {
    border: 1px solid #e5e7eb; border-radius: 8px; margin: 6px 0; overflow: hidden; font-size: 13px;
  }
  .tool-block.running { border-left: 3px solid #f59e0b; background: #fffbeb; }
  .tool-block.done    { border-left: 3px solid #10b981; background: #f0fdf4; }
  .tool-header { padding: 6px 10px; display: flex; align-items: center; gap: 6px; }
  .tool-icon  { font-size: 14px; flex-shrink: 0; }
  .tool-name  { font-weight: 600; color: #374151; }
  .tool-args  { color: #9ca3af; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .tool-status { margin-left: auto; font-size: 11px; font-weight: 500; flex-shrink: 0; }
  .tool-block.running .tool-status { color: #d97706; }
  .tool-block.done .tool-status    { color: #059669; }
  .tool-spinner {
    width: 12px; height: 12px; border: 2px solid #fcd34d;
    border-top-color: #f59e0b; border-radius: 50%;
    animation: tool-spin .6s linear infinite; flex-shrink: 0;
  }
  @keyframes tool-spin { to { transform: rotate(360deg); } }
  .tool-result {
    padding: 6px 10px; font-size: 12px; color: #6b7280; line-height: 1.5;
    max-height: 120px; overflow-y: auto; white-space: pre-wrap;
    border-top: 1px solid #e5e7eb; background: #fff;
  }
  footer {
    padding: 12px 16px; background: #fff; border-top: 1px solid #e5e7eb;
    display: flex; gap: 8px;
  }
  footer input {
    flex: 1; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 14px;
    font-size: 14px; outline: none; transition: border-color .2s;
  }
  footer input:focus { border-color: #3b82f6; }
  footer button {
    background: #3b82f6; color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; cursor: pointer; font-weight: 500;
    transition: background .2s;
  }
  footer button:hover { background: #2563eb; }
  footer button:disabled { background: #93c5fd; cursor: not-allowed; }
  .empty { text-align: center; color: #9ca3af; margin-top: 60px; font-size: 14px; }
  .typing { display: inline-block; width: 6px; height: 14px; background: #3b82f6;
    animation: blink .6s infinite; vertical-align: middle; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  /* markdown 内容样式 */
  .bubble .md-content p { margin: 4px 0; }
  .bubble .md-content p:first-child { margin-top: 0; }
  .bubble .md-content p:last-child { margin-bottom: 0; }
  .bubble .md-content code {
    background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 0.9em;
  }
  .bubble .md-content pre {
    background: #f3f4f6; border-radius: 6px; padding: 8px 12px; overflow-x: auto;
    font-size: 13px; line-height: 1.5; margin: 6px 0;
  }
  .bubble .md-content pre code { background: none; padding: 0; }
  .bubble .md-content ul, .bubble .md-content ol { padding-left: 20px; margin: 4px 0; }
  .bubble .md-content blockquote {
    border-left: 3px solid #d1d5db; padding-left: 10px; color: #6b7280; margin: 6px 0;
  }
  .bubble .md-content a { color: #3b82f6; }
  .msg.user .bubble .md-content code { background: rgba(255,255,255,.2); }
  .msg.user .bubble .md-content pre { background: rgba(255,255,255,.15); }
  .msg.user .bubble .md-content a { color: #bfdbfe; }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<header><span class="dot"></span> Mini CS Agent</header>
<div id="chat"><div class="empty">👋 输入消息开始对话</div></div>
<footer>
  <input id="input" type="text" placeholder="输入消息…" autofocus>
  <button id="send" onclick="send()">发送</button>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let sending = false;

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function send() {
  const text = input.value.trim();
  if (!text || sending) return;
  sending = true;
  input.value = '';
  sendBtn.disabled = true;

  removeEmpty();
  addUserMsg(text);
  const agentEl = addAgentMsg();

  let reasoningEl = null;    // 当前活跃的思考块 DOM
  let tokenEl = null;        // 正文文本块 DOM
  let tokenText = '';        // 当前正文块累计文本（用于 markdown 渲染）
  let toolBlocks = new Map(); // run_id → 工具调用块 DOM
  // rAF 批量渲染
  let reasonBuf = '';
  let tokenBuf = '';
  let rafId = null;
  let needScroll = false;

  function flushDOM() {
    if (reasoningEl && reasonBuf) {
      reasoningEl.querySelector('.body').textContent += reasonBuf;
      reasonBuf = '';
    }
    if (tokenEl && tokenBuf) {
      tokenText += tokenBuf;
      tokenBuf = '';
      tokenEl.innerHTML = '<div class="md-content">' + marked.parse(tokenText) + '</div>';
    }
    if (needScroll) {
      chat.scrollTop = chat.scrollHeight;
      needScroll = false;
    }
    rafId = null;
  }

  function scheduleFlush() {
    if (!rafId) rafId = requestAnimationFrame(flushDOM);
  }

  try {
    const resp = await fetch('/api/v1/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop(); // keep incomplete line

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') continue;
        let event;
        try { event = JSON.parse(data); } catch { continue; }

        switch (event.type) {
          case 'reasoning':
            // 开始新推理 → 关闭当前正文块，后续 token 将创建新块
            tokenEl = null;
            tokenText = '';
            if (!reasoningEl) {
              reasoningEl = addThinking(agentEl);
            }
            reasonBuf += event.content;
            scheduleFlush();
            break;
          case 'token':
            // tokenEl 为 null 时创建新正文块（reasoning/tool 会将其置 null）
            if (!tokenEl) {
              tokenEl = addTokenArea(agentEl);
            }
            tokenBuf += event.content;
            needScroll = true;
            scheduleFlush();
            break;
          case 'tool_start':
            // 开始工具调用 → 关闭当前正文块和思考面板，创建工具卡片
            tokenEl = null;
            tokenText = '';
            reasoningEl = null;
            toolBlocks.set(event.run_id, addToolBlock(agentEl, event.name, event.input));
            needScroll = true;
            break;
          case 'tool_end':
            // 完成工具调用 → 按 run_id 匹配对应的工具卡片
            const tb = toolBlocks.get(event.run_id);
            if (tb) {
              finishToolBlock(tb, event.name, event.output);
              toolBlocks.delete(event.run_id);
            }
            needScroll = true;
            break;
          case 'done':
            // flush 剩余 buffer，移除打字光标
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            flushDOM();
            const bubble = agentEl.querySelector('.bubble');
            const cursor = bubble.querySelector('.typing');
            if (cursor) cursor.remove();
            break;
        }
      }
      // 每批数据处理完后至少滚一次
      if (needScroll) { chat.scrollTop = chat.scrollHeight; needScroll = false; }
    }
  } catch (err) {
    const bubble = agentEl.querySelector('.bubble');
    const errEl = document.createElement('div');
    errEl.style.cssText = 'color:#ef4444;font-size:13px;margin-top:4px;';
    errEl.textContent = '请求失败: ' + err.message;
    bubble.appendChild(errEl);
  }
  sending = false;
  sendBtn.disabled = false;
  input.focus();
}

function removeEmpty() {
  const el = chat.querySelector('.empty');
  if (el) el.remove();
}

function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="avatar">U</div><div class="bubble">${escapeHtml(text)}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addAgentMsg() {
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.innerHTML = `<div class="avatar">AI</div><div class="bubble"><span class="typing"></span></div>`;
  chat.appendChild(div);
  return div;
}

function addThinking(parent) {
  const bubble = parent.querySelector('.bubble');
  const details = document.createElement('details');
  details.className = 'thinking';
  details.open = true;
  details.innerHTML = '<summary>🧠 深度思考</summary><div class="body"></div>';
  bubble.appendChild(details);
  return details;
}

function addTokenArea(parent) {
  const bubble = parent.querySelector('.bubble');
  const cursor = bubble.querySelector('.typing');
  if (cursor) cursor.remove();

  const div = document.createElement('div');
  bubble.appendChild(div);
  return div;
}

function addToolBlock(parent, name, input) {
  const bubble = parent.querySelector('.bubble');
  const block = document.createElement('div');
  block.className = 'tool-block running';
  const icon = getToolIcon(name);
  const args = typeof input === 'string' ? input : JSON.stringify(input).slice(0, 100);
  block.innerHTML =
    `<div class="tool-header">` +
    `<span class="tool-icon">${icon}</span>` +
    `<span class="tool-name">${escapeHtml(name)}</span>` +
    `<span class="tool-args">${escapeHtml(args)}</span>` +
    `<span class="tool-spinner"></span>` +
    `<span class="tool-status">执行中</span>` +
    `</div>`;
  bubble.appendChild(block);
  return block;
}

function finishToolBlock(block, name, output) {
  block.classList.remove('running');
  block.classList.add('done');
  const spinner = block.querySelector('.tool-spinner');
  if (spinner) spinner.remove();
  const status = block.querySelector('.tool-status');
  if (status) status.textContent = '✓ 完成';
  if (output) {
    const result = document.createElement('div');
    result.className = 'tool-result';
    result.textContent = output.slice(0, 500);
    block.appendChild(result);
  }
}

function getToolIcon(name) {
  const icons = { web_search: '🔍', default: '🔧' };
  return icons[name] || icons.default;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
